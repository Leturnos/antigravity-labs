<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Neon Glow Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="pinkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Cyber Hexagon / Matrix Shield -->
  <polygon points="256,44 436,148 436,356 256,460 76,356 76,148" 
           fill="none" stroke="url(#cyanPurple)" stroke-width="6" stroke-opacity="0.4" />
  
  <polygon points="256,76 408,164 408,340 256,428 104,340 104,164" 
           fill="#0f172a" fill-opacity="0.6" stroke="url(#pinkPurple)" stroke-width="3" stroke-dasharray="12,8" />

  <!-- Matrix Interconnect Lines / Neural Synapses -->
  <!-- Left to Center -->
  <line x1="104" y1="256" x2="256" y2="256" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="6,4" />
  <line x1="160" y1="160" x2="256" y2="210" stroke="#00f3ff" stroke-width="2.5" stroke-opacity="0.5" />
  <line x1="160" y1="352" x2="256" y2="302" stroke="#00f3ff" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Right to Center -->
  <line x1="408" y1="256" x2="256" y2="256" stroke="#ec4899" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="6,4" />
  <line x1="352" y1="160" x2="256" y2="210" stroke="#ec4899" stroke-width="2.5" stroke-opacity="0.5" />
  <line x1="352" y1="352" x2="256" y2="302" stroke="#ec4899" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Top (Judge/Arbitration Core) -->
  <line x1="256" y1="100" x2="256" y2="210" stroke="#8b5cf6" stroke-width="3.5" stroke-opacity="0.8" />

  <!-- Pod A (Debater A - Cyan Node) -->
  <g transform="translate(150, 256)">
    <circle r="36" fill="#0b1329" stroke="#00f3ff" stroke-width="4" filter="url(#glowCyan)" />
    <circle r="18" fill="#00f3ff" fill-opacity="0.3" />
    <polygon points="0,-16 14,8 -14,8" fill="#00f3ff" />
  </g>

  <!-- Pod B (Debater B - Pink Node) -->
  <g transform="translate(362, 256)">
    <circle r="36" fill="#1f0e24" stroke="#ec4899" stroke-width="4" filter="url(#glowPurple)" />
    <circle r="18" fill="#ec4899" fill-opacity="0.3" />
    <circle r="12" fill="#ec4899" />
  </g>

  <!-- Pod Judge (Top - Purple / Scales of Justice Node) -->
  <g transform="translate(256, 120)">
    <circle r="40" fill="#180e29" stroke="#8b5cf6" stroke-width="5" filter="url(#glowPurple)" />
    <circle r="22" fill="#8b5cf6" fill-opacity="0.4" />
    <!-- Scale icon -->
    <path d="M-14,-6 L14,-6 M0,-14 L0,14 M-14,6 L-8,6 M8,6 L14,6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Central Neural Matrix Core / Quantum Arbiter Diamond -->
  <g transform="translate(256, 256)">
    <polygon points="0,-48 48,0 0,48 -48,0" fill="#0d1117" stroke="url(#cyanPurple)" stroke-width="4" filter="url(#glowCyan)" />
    <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#pinkPurple)" fill-opacity="0.8" />
    <circle r="8" fill="#ffffff" filter="url(#glowCyan)" />
  </g>

  <!-- Lower Circuit Base & Status Indicator -->
  <path d="M180,410 L256,380 L332,410" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
  <circle cx="256" cy="380" r="6" fill="#00f3ff" filter="url(#glowCyan)" />
  <circle cx="180" cy="410" r="5" fill="#ec4899" />
  <circle cx="332" cy="410" r="5" fill="#00f3ff" />
</svg>
