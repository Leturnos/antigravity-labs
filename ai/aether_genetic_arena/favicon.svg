<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bgGlow)"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3 2"/>
  
  <!-- Neural Connections -->
  <line x1="9" y1="11" x2="16" y2="7" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="9" y1="21" x2="16" y2="25" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="9" y1="11" x2="16" y2="25" stroke="rgba(255,255,255,0.3)" stroke-width="0.9"/>
  <line x1="9" y1="21" x2="16" y2="7" stroke="rgba(255,255,255,0.3)" stroke-width="0.9"/>
  <line x1="16" y1="7" x2="23" y2="16" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="16" y1="25" x2="23" y2="16" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.8"/>
  
  <!-- Neural Nodes -->
  <circle cx="9" cy="11" r="2.5" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="9" cy="21" r="2.5" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="16" cy="7" r="2.5" fill="#a855f7" filter="url(#neonGlow)"/>
  <circle cx="16" cy="25" r="2.5" fill="#a855f7" filter="url(#neonGlow)"/>
  <circle cx="23" cy="16" r="3.2" fill="#ec4899" filter="url(#neonGlow)"/>
</svg>
