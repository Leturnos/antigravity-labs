<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="32" height="32" rx="8" fill="url(#bgGlow)"/>
  <rect width="32" height="32" rx="8" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.3"/>
  
  <!-- Outer Cyber Reticle Ring -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 2.5"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Crosshair Reticle Brackets -->
  <path d="M 4 16 L 8 16 M 24 16 L 28 16 M 16 4 L 16 8 M 16 24 L 16 28" stroke="#00f3ff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Hand Landmark Constellation Nodes -->
  <line x1="16" y1="16" x2="11" y2="10" stroke="rgba(0, 243, 255, 0.7)" stroke-width="1"/>
  <line x1="16" y1="16" x2="21" y2="10" stroke="rgba(236, 72, 153, 0.7)" stroke-width="1"/>
  <line x1="16" y1="16" x2="16" y2="22" stroke="rgba(139, 92, 246, 0.7)" stroke-width="1"/>
  
  <!-- Central Iris Core -->
  <circle cx="16" cy="16" r="3.5" fill="url(#irisGlow)" filter="url(#neonGlow)"/>
  <circle cx="16" cy="16" r="1.5" fill="#ffffff"/>
  
  <!-- Fingertip Tracking Nodes -->
  <circle cx="11" cy="10" r="1.8" fill="#00f3ff" filter="url(#neonGlow)"/>
  <circle cx="21" cy="10" r="1.8" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="16" cy="22" r="1.8" fill="#8b5cf6" filter="url(#neonGlow)"/>
</svg>
