<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70ffff" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0077" />
      <stop offset="100%" stop-color="#b8004f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Energy Grid lines -->
  <path d="M12 48 L52 48 M20 54 L44 54 M32 8 L32 54" stroke="#00f3ff" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2 2" />

  <!-- Tower Base (Octagonal / Trapzoid Platform) -->
  <polygon points="14,52 22,42 42,42 50,52" fill="#0d1b33" stroke="#00f3ff" stroke-width="1.5" />
  <line x1="22" y1="42" x2="42" y2="42" stroke="#ff0055" stroke-width="2" filter="url(#glow)" />

  <!-- Pylons / Vertical Conductors -->
  <path d="M22 42 L26 24 L30 24 L28 42 Z" fill="#0f2648" stroke="#00f3ff" stroke-width="1" />
  <path d="M42 42 L38 24 L34 24 L36 42 Z" fill="#0f2648" stroke="#00f3ff" stroke-width="1" />

  <!-- Neon Focus Emitters -->
  <circle cx="27" cy="24" r="2.5" fill="#00f3ff" filter="url(#glow)" />
  <circle cx="37" cy="24" r="2.5" fill="#00f3ff" filter="url(#glow)" />

  <!-- Central Core / Plasma Orb -->
  <circle cx="32" cy="28" r="5" fill="#ff0055" filter="url(#glow)" />
  <circle cx="32" cy="28" r="2.5" fill="#ffffff" />

  <!-- Spire Turret Head -->
  <polygon points="32,8 26,20 38,20" fill="url(#cyanGrad)" stroke="#00f3ff" stroke-width="1" filter="url(#glow)" />

  <!-- Top Laser Beam Pulse -->
  <line x1="32" y1="3" x2="32" y2="8" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <circle cx="32" cy="4" r="1.5" fill="#ff0055" filter="url(#glow)" />
</svg>
