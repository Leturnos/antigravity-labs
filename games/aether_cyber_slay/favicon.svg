<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070b14" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Circuit grid background -->
  <path d="M12 24 L24 24 L32 14 L48 14" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <path d="M16 50 L28 50 L36 40 L52 40" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <!-- Outer glowing hexagon -->
  <path d="M32 10 L52 21 L52 43 L32 54 L12 43 L12 21 Z" stroke="url(#cyber-glow)" stroke-width="3" fill="none" filter="url(#neon)"/>
  <!-- Inner cyber core -->
  <polygon points="32,20 44,28 44,36 32,44 20,36 20,28" fill="#f43f5e" fill-opacity="0.85" filter="url(#neon)"/>
  <!-- Core energy lightning -->
  <path d="M30 24 L35 31 L30 33 L34 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Circuit Nodes -->
  <circle cx="32" cy="10" r="2.5" fill="#00f0ff" filter="url(#neon)"/>
  <circle cx="52" cy="21" r="2" fill="#00f0ff"/>
  <circle cx="52" cy="43" r="2" fill="#f43f5e"/>
  <circle cx="32" cy="54" r="2.5" fill="#f43f5e" filter="url(#neon)"/>
  <circle cx="12" cy="43" r="2" fill="#f43f5e"/>
  <circle cx="12" cy="21" r="2" fill="#00f0ff"/>
</svg>
