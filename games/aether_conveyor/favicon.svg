<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Rounded Hexagon / Square -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0a0e17" stroke="#1e293b" stroke-width="2" />

  <!-- Industrial Conveyor Track -->
  <rect x="12" y="24" width="40" height="16" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Conveyor Roller Chevrons -->
  <path d="M 20 28 L 26 32 L 20 36" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <path d="M 32 28 L 38 32 L 32 36" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <path d="M 44 28 L 50 32 L 44 36" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Top Inserter Arm Gripper -->
  <circle cx="32" cy="14" r="3" fill="#f59e0b" />
  <line x1="32" y1="14" x2="38" y2="24" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- Carried Circuit Component -->
  <rect x="35" y="21" width="6" height="6" rx="1" fill="#10b981" />
</svg>
